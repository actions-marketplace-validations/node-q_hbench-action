name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: actionlint, shellcheck and the report's syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint, verifying its checksum
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/checksums.txt" "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive\$" checksums.txt | sha256sum --check --strict)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: Lint the scripts
        run: shellcheck scripts/*.sh
      - name: Compile the report
        run: python3 -m py_compile scripts/report.py

  install:
    name: Install ${{ matrix.version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
        version: [latest, v0.3.0]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hbench, checking its build provenance
        id: hbench
        uses: ./
        with:
          version: ${{ matrix.version }}
          verify-provenance: 'true'
      - name: Check the installed version and the outputs
        env:
          VERSION: ${{ steps.hbench.outputs.version }}
          HBENCH_PATH: ${{ steps.hbench.outputs.hbench-path }}
          REQUESTED: ${{ matrix.version }}
          JOB_DIR: ${{ steps.hbench.outputs.job-dir }}
        run: |
          [[ "$REQUESTED" == latest || "$VERSION" == "$REQUESTED" ]]
          [[ "$(hbench --version)" == "hbench ${VERSION#v}" ]]
          [[ "$(command -v hbench)" == "$HBENCH_PATH" ]]
          [[ -z "$JOB_DIR" ]]

  run-local:
    name: Run the oracle on a local task, with min-mean-reward 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run hbench
        id: hbench
        uses: ./
        with:
          path: tests/tasks
          agent: oracle
          min-mean-reward: '1'
          artifact-name: hbench-run-local
          artifact-retention-days: '1'
      - name: Check the outputs
        env:
          MEAN_REWARD: ${{ steps.hbench.outputs.mean-reward }}
          N_TRIALS: ${{ steps.hbench.outputs.n-trials }}
          N_ERRORS: ${{ steps.hbench.outputs.n-errors }}
          RESULT_PATH: ${{ steps.hbench.outputs.result-path }}
          ARTIFACT_ID: ${{ steps.hbench.outputs.artifact-id }}
        run: |
          [[ "$MEAN_REWARD" == 1.0 && "$N_TRIALS" == 1 && "$N_ERRORS" == 0 ]]
          [[ -f "$RESULT_PATH" && -n "$ARTIFACT_ID" ]]

  run-below-threshold:
    name: Fail when the mean reward is below min-mean-reward
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the nop agent, which scores 0
        id: hbench
        continue-on-error: true
        uses: ./
        with:
          path: tests/tasks
          agent: nop
          min-mean-reward: '0.5'
          upload-artifact: 'false'
      - name: Check that the step failed on the score alone
        env:
          OUTCOME: ${{ steps.hbench.outcome }}
          MEAN_REWARD: ${{ steps.hbench.outputs.mean-reward }}
          N_ERRORS: ${{ steps.hbench.outputs.n-errors }}
        run: |
          [[ "$OUTCOME" == failure && "$MEAN_REWARD" == 0.0 && "$N_ERRORS" == 0 ]]

  run-oci-dataset:
    name: Run the oracle on an OCI dataset, locked by digest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run two tasks of humaneval-plus@1.0
        id: hbench
        uses: ./
        with:
          dataset: humaneval-plus@1.0
          registry: oci://ghcr.io/node-q/hbench-datasets
          agent: oracle
          n-tasks: '2'
          args: --lock-write
          working-directory: ${{ runner.temp }}
          min-mean-reward: '1'
          upload-artifact: 'false'
      - name: Check the outputs and the lock
        env:
          N_TRIALS: ${{ steps.hbench.outputs.n-trials }}
        run: |
          [[ "$N_TRIALS" == 2 ]]
          grep -q '^"humaneval-plus@1.0" = "sha256:' "$RUNNER_TEMP/hbench.lock"
